name: Release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Validate release tag
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must look like 1.2.3, got '$RELEASE_TAG'."
            exit 1
          fi

          node --input-type=module <<'NODE'
          import pkg from "./package.json" with { type: "json" };

          const tag = process.env.RELEASE_TAG;

          if (tag !== pkg.version) {
          	throw new Error(`Release tag ${tag} does not match package.json version ${pkg.version}.`);
          }
          NODE

          release_branch=""
          for candidate in master main; do
            if git ls-remote --exit-code --heads origin "$candidate" >/dev/null 2>&1; then
              git fetch origin "refs/heads/$candidate:refs/remotes/origin/$candidate"
              release_branch="$candidate"
              break
            fi
          done

          if [[ -z "$release_branch" ]]; then
            echo "Could not find a main or master branch on origin."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$release_branch"; then
            echo "Release tag must point to a commit reachable from origin/$release_branch."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Typescript check
        run: npm run typecheck

      - name: Biome Linter
        run: npm run check

      - name: Test
        run: npm test

      - name: Publish package to npm
        run: |
          if npm view "bibtex-tidy@$RELEASE_TAG" version >/dev/null 2>&1; then
            echo "npm package bibtex-tidy@$RELEASE_TAG is already published."
          else
            npm publish --provenance
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
